<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1c1b19" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>Endless Space</title>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="ui">
      <div id="hud" class="layer">
        <div class="hud-top">
          <div class="hud-side">
            <div class="label dim">level</div>
            <div id="hud-level" class="level-num">1</div>
          </div>
          <div class="hud-centre">
            <div id="hud-score" class="score">0</div>
            <div class="progress"><div id="hud-progress" class="progress-fill"></div></div>
            <div id="room-label" class="label dim room-label"></div>
          </div>
          <div class="hud-side right"><span id="hud-pause" class="label link">pause</span></div>
        </div>
        <div id="hud-boost" class="hud-boost"><span class="label">hold to boost</span></div>
        <div id="boost-pct" class="label boost-pct">boost 0</div>
        <div id="hud-power" class="label boost-pct power-label"></div>
        <div id="boost-bar" class="boost-bar"><div id="boost-fill" class="boost-fill"></div></div>
      </div>

      <div id="notice" class="label notice"></div>
      <div id="hint" class="label hint"></div>

      <div id="combo" class="combo">
        <div id="combo-count" class="combo-count">x1</div>
        <div id="combo-label" class="label">near miss</div>
      </div>

      <div id="level-banner" class="banner">
        <div class="label">level</div>
        <div id="banner-num" class="banner-num">1</div>
        <div id="banner-theme" class="label dim banner-theme"></div>
      </div>

      <div id="screen-title" class="layer screen">
        <span id="title-settings" class="label link corner-link">settings</span>
        <div class="title-mark">endless<br />space</div>
        <div class="screen-foot">
          <button id="title-start" class="label button" type="button">press to start</button>
          <div class="title-links">
            <span class="label link" data-title="from">start: open ground</span>
            <span class="label link" data-title="daily">daily run</span>
            <span class="label link" data-title="missions">missions</span>
            <span class="label link" data-title="hangar">hangar</span>
            <span class="label link" data-title="stats">stats</span>
          </div>
          <div id="title-best" class="label dim"></div>
        </div>
      </div>

      <div id="screen-paused" class="layer screen">
        <div class="screen-center">
          <div class="label">paused</div>
          <div class="menu">
            <button class="label button" type="button" data-action="resume">resume</button>
            <button class="label button" type="button" data-action="settings">settings</button>
            <button class="label button" type="button" data-action="menu">main menu</button>
          </div>
        </div>
      </div>

      <div id="screen-settings" class="layer screen">
        <div class="settings">
          <div class="label dim settings-title">settings</div>
          <div class="label dim settings-group">sound</div>
          <button class="setting-row" type="button" data-setting="sound"><span class="label">sound</span><span class="label value"></span></button>
          <button class="setting-row" type="button" data-setting="music"><span class="label">music</span><span class="label value"></span></button>
          <button class="setting-row" type="button" data-setting="effects"><span class="label">effects</span><span class="label value"></span></button>
          <div class="label dim settings-group">controls</div>
          <button class="setting-row" type="button" data-setting="tilt"><span class="label">tilt to steer</span><span class="label value"></span></button>
          <button class="setting-row" type="button" data-setting="tiltSensitivity"><span class="label">tilt sensitivity</span><span class="label value"></span></button>
          <button class="setting-row" type="button" data-setting="touch"><span class="label">touch steering</span><span class="label value"></span></button>
          <button class="setting-row" type="button" data-setting="steering"><span class="label">drag sensitivity</span><span class="label value"></span></button>
          <button class="setting-row" type="button" data-setting="boostSide"><span class="label">boost button</span><span class="label value"></span></button>
          <button class="setting-row" type="button" data-setting="haptics"><span class="label">vibration</span><span class="label value"></span></button>
          <div class="label dim settings-group">display</div>
          <button class="setting-row" type="button" data-setting="reduceMotion"><span class="label">reduce motion</span><span class="label value"></span></button>
          <button class="setting-row" type="button" data-setting="textSize"><span class="label">text size</span><span class="label value"></span></button>
          <button class="setting-row" type="button" data-setting="contrast"><span class="label">high contrast</span><span class="label value"></span></button>
          <div class="label dim settings-group">assist</div>
          <button class="setting-row" type="button" data-setting="assist"><span class="label">assist mode</span><span class="label value"></span></button>
          <div class="label dim setting-note">slower, with the safe line marked. scores don't count as bests</div>          <div class="menu left">
            <button class="label button" type="button" data-action="back">back</button>
          </div>
        </div>
      </div>
      <div id="screen-stats" class="layer screen">
        <div class="settings">
          <div class="label dim settings-title">stats</div>
          <div id="stats-rows"></div>
          <div class="menu left">
            <button class="label button" type="button" data-action="back">back</button>
          </div>
        </div>
      </div>

      <div id="screen-missions" class="layer screen">
        <div class="settings">
          <div class="label dim settings-title">missions</div>
          <div id="missions-rows"></div>
          <div id="missions-next" class="label dim settings-group"></div>
          <div class="menu left">
            <button class="label button" type="button" data-action="back">back</button>
          </div>
        </div>
      </div>

      <div id="screen-hangar" class="layer screen">
        <div class="settings">
          <div class="label dim settings-title">hangar</div>
          <button class="setting-row" type="button" data-hangar="ship"><span class="label">ship</span><span class="label value"></span></button>
          <button class="setting-row" type="button" data-hangar="trail"><span class="label">trail</span><span class="label value"></span></button>
          <button class="setting-row" type="button" data-hangar="palette"><span class="label">colours</span><span class="label value"></span></button>
          <div id="hangar-count" class="label dim settings-group"></div>
          <div class="menu left">
            <button class="label button" type="button" data-action="back">back</button>
          </div>
        </div>
      </div>

      <div id="screen-over" class="layer screen">
        <div class="screen-center">
          <div class="label">crashed</div>
          <div id="over-score" class="score">0</div>
          <div id="over-best" class="label dim"></div>
          <div id="over-stats" class="label dim"></div>
          <div id="over-extra" class="label dim"></div>
          <div id="over-missions" class="label dim over-missions"></div>
          <div class="label rule">tap to retry</div>
          <div class="menu">
            <button class="label button" type="button" data-action="menu">main menu</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
